name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - name: Build release
        run: cargo build --release

      - name: Name Windows asset
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          mv target/release/localrecord.exe "localrecord-${version}.exe"

      - name: Upload Windows binary
        uses: softprops/action-gh-release@v2
        with:
          files: localrecord-*.exe
          generate_release_notes: true

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpulse-dev libopus-dev libgtk-3-dev libayatana-appindicator3-dev

      - name: Build release
        run: cargo build --release

      - name: Name Linux asset
        run: |
          version="${GITHUB_REF_NAME#v}"
          mv target/release/localrecord "localrecord-${version}-x86_64-linux"

      - name: Upload Linux binary
        uses: softprops/action-gh-release@v2
        with:
          files: localrecord-*-x86_64-linux
          generate_release_notes: true
