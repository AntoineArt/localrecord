[package]
name = "localrecord"
version = "0.1.16"
edition = "2021"
description = "Lightweight tray app to record mic + desktop audio"
license = "MIT"

[[bin]]
name = "localrecord"
path = "src/main.rs"

[dependencies]
chrono = "0.4"
crossbeam-channel = "0.5"
directories = "5"
global-hotkey = "0.7"
tray-icon = { version = "0.19", default-features = false }
winit = "0.30"
ogg = "0.9.2"

[target.'cfg(windows)'.dependencies]
wasapi = "0.22"
audiopus = "0.2.0"
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Threading",
    "Win32_System_Memory",
    "Win32_System_LibraryLoader",
    "Win32_Security",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_DataExchange",
    "Win32_System_Ole",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_System_Registry",
    "UI_Notifications",
    "Data_Xml_Dom",
    "Win32_System_WinRT",
] }

[target.'cfg(target_os = "linux")'.dependencies]
audiopus = "0.2.0"
libpulse-binding = "2.28"
libpulse-simple-binding = "2.29"
libc = "0.2"
notify-rust = "4"
rfd = "0.15"
arboard = "3"
gtk = "0.18"

[build-dependencies]
winres = "0.1"

[profile.release]
lto = true
codegen-units = 1
strip = true
